name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-tests:
    name: PHP ${{ matrix.php }} - Linter, Static Analysis & Pest Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: padindi_testing
          POSTGRES_USER: padindi
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, zip, gd, fileinfo
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Copy Environment & Install Dependencies
        working-directory: backend
        run: |
          cp .env.example .env.testing
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate App Key
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: padindi_testing
          DB_USERNAME: padindi
          DB_PASSWORD: secret
        run: |
          php artisan key:generate --env=testing

      - name: Run Code Style Check (Laravel Pint)
        working-directory: backend
        run: composer lint

      - name: Run Static Analysis (Larastan Level 5)
        working-directory: backend
        run: composer analyse

      - name: Run Tests (Pest 3)
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: padindi_testing
          DB_USERNAME: padindi
          DB_PASSWORD: secret
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: composer test
