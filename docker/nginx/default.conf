# Nginx configuration for Yayasan Padindi
# See ARCHITECTURE.md section 14.3 for design decisions.
#
# / → static files from frontend build (try_files to index.html for SPA)
# /api and /sanctum → PHP-FPM (Laravel)
# /storage → public disk only; private disk is NEVER mapped.

server {
    listen 80;
    server_name _;
    root /var/www/html/frontend/dist;
    index index.html;

    client_max_body_size 6M;   # Align with upload limit in config/registration.php

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    # CSP is set per environment; placeholder only here.
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; ...";

    # Block access to hidden files and PHP outside index.php
    location ~ /\. {
        deny all;
    }

    # Serve frontend static assets with long cache (immutable hash filenames)
    location ~* \.(js|css|woff2?|ico|png|jpg|jpeg|webp|svg|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public storage disk (CMS images) — served directly
    location /storage/ {
        alias /var/www/html/backend/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        # NOTE: Private documents are NEVER served here.
        # Private disk path (/storage/app/private) is intentionally excluded.
    }

    # Laravel API — forwarded to PHP-FPM
    location /api {
        try_files $uri $uri/ @laravel;
    }

    # Sanctum CSRF cookie — forwarded to PHP-FPM
    location /sanctum {
        try_files $uri $uri/ @laravel;
    }

    # Laravel catch-all for API and Sanctum
    location @laravel {
        root /var/www/html/backend/public;
        fastcgi_pass php-fpm:9000;   # Adjust to your PHP-FPM container/socket
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    # SPA fallback: all other routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
